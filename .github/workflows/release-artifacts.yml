name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to backfill (for example v1.5.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release tag: $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify package version
        env:
          PACKAGE_JSON: package.json
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync(process.env.PACKAGE_JSON, "utf8"));
            if (pkg.version !== process.env.VERSION) {
              throw new Error(`Package version ${pkg.version} does not match release ${process.env.VERSION}`);
            }
          '

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            asset: showdar-skills-darwin-arm64.tar.gz
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            asset: showdar-skills-darwin-x64.tar.gz
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            asset: showdar-skills-linux-x64.tar.gz
          - runner: windows-2022
            platform: windows
            arch: x64
            asset: showdar-skills-windows-x64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0

      - name: Refresh release packager for manual backfill
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --depth=1
          mkdir -p scripts
          git show FETCH_HEAD:scripts/package-release-bundle.mjs > scripts/package-release-bundle.mjs

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify package can be packed
        run: npm pack --dry-run

      - name: Build portable runtime bundle
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: >-
          node scripts/package-release-bundle.mjs --tool "showdar-skills" --bin-name "showdar" --package-name "showdar-skills" --package-dir "." --entry "bin/showdar.js" --version "${{ needs.metadata.outputs.version }}"

      - name: Create tar.gz archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: tar -C .release/bundle -czf "$ASSET" .

      - name: Create zip archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: Compress-Archive -Path '.release/bundle/*' -DestinationPath $env:ASSET -CompressionLevel Optimal

      - name: Write SHA-256 checksum
        env:
          ASSET: ${{ matrix.asset }}
        shell: bash
        run: |
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            const file = process.env.ASSET;
            const hash = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            fs.writeFileSync(`${file}.sha256`, `${hash}  ${path.basename(file)}\n`);
          '

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Attach assets to GitHub Release
    needs: [metadata, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Wait for release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in {1..120}; do
            if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              found=1
              break
            fi
            echo "GitHub Release $TAG is not available yet; retry $attempt/120"
            sleep 10
          done
          [[ "$found" -eq 1 ]] || {
            echo "GitHub Release $TAG was not created in time" >&2
            exit 1
          }
          gh release upload "$TAG" release-assets/* --repo "$GH_REPO" --clobber
