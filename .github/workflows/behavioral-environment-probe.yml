name: Verify secret-free owner Environment approval

on:
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    if: github.repository == 'caongocquy/showdar-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Validate existing protection and publish probe approval digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/behavioral-eval-environment-probe.mjs --prepare

  approve:
    if: github.repository == 'caongocquy/showdar-skills' && github.ref == 'refs/heads/main'
    needs: prepare
    environment:
      name: showdar-paid-capture
      url: https://github.com/caongocquy/showdar-skills/actions/runs/${{ github.run_id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify native owner approval and exact probe digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/behavioral-eval-environment-probe.mjs --verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: environment-probe-${{ github.run_attempt }}
          path: ${{ runner.temp }}/environment-probe.json
          if-no-files-found: error
          retention-days: 90

  reject-unauthorized-ref:
    if: github.repository == 'caongocquy/showdar-skills' && github.ref != 'refs/heads/main'
    environment: showdar-paid-capture
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    permissions: {}
    steps:
      # If this sentinel starts, GitHub did not enforce the Environment branch restriction.
      - name: UNAUTHORIZED_ENVIRONMENT_JOB_STARTED
        run: node -e 'throw new Error("UNAUTHORIZED_ENVIRONMENT_JOB_STARTED")'
