name: Verify PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Check release version
        run: |
          version=$(node -p "require('./package.json').version")
          npm run release:check -- "v${version}"

      - name: Test, validate and pack
        run: npm run check

      - name: Evaluate retrieval and workflows
        run: npm run eval

      - name: Smoke test package
        run: npm run smoke

      - name: Verify whitespace
        run: git diff --check

  sandbox-isolation:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Confirm Docker daemon
        run: docker version

      - name: Provision explicit probe image
        run: docker pull node@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1

      - name: Verify real container isolation (model-free)
        run: node --test scripts/lib/behavioral-eval/container-sandbox.integration.mjs

      - name: Build pinned-base offline tool image
        run: docker build --pull=false -f evals/behavioral/Dockerfile.tool-runtime -t showdar-eval-tools:ci .

      - name: Exercise mediated tools in isolated containers
        run: node --test scripts/lib/behavioral-eval/sandbox-tool-runtime.integration.mjs

  tool-image-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Build unsigned model-free image and verify its archive contract
        run: |
          docker build --pull=false -f evals/behavioral/Dockerfile.tool-runtime -t showdar-eval-tools:ci .
          node --test scripts/lib/behavioral-eval/tool-image-provenance.integration.mjs
